<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Claim Settled · Catalyst</title>
<meta name="theme-color" content="#2A1745" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<script src="arcade.js"></script>
<script src="claim.js"></script>
<style>
  :root{ --bg0:#160d28; --glass:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
    --txt:#eaf1fb; --muted:#b6a6d6; --blue:#7C3AED; --cyan:#E0218A; --green:#34d399; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body{ margin:0; min-height:100%; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt); background:var(--bg0); overflow-x:hidden; min-height:100vh;
    display:flex; justify-content:center; align-items:flex-start; padding:18px; padding-top:max(18px,env(safe-area-inset-top)); }
  body::before{ content:""; position:fixed; inset:0; z-index:-1;
    background:radial-gradient(80vmax 60vmax at 50% -10%,rgba(52,211,153,.16),transparent 60%),
               radial-gradient(70vmax 50vmax at 50% 120%,rgba(124,58,237,.18),transparent 60%); }
  .app{ width:100%; max-width:460px; }
  .top{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .top a{ color:var(--cyan); text-decoration:none; font-weight:700; font-size:14px; }

  .hero{ text-align:center; margin-bottom:14px; }
  .grade{ width:90px; height:90px; border-radius:26px; margin:0 auto 10px; display:flex; align-items:center; justify-content:center;
    font-size:46px; font-weight:900; color:#04121f; background:linear-gradient(135deg,var(--green),#a3e635);
    box-shadow:0 14px 34px rgba(52,211,153,.4); animation:pop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop{ from{transform:scale(.4); opacity:0;} to{transform:scale(1); opacity:1;} }
  .hero h1{ font-size:26px; margin:4px 0 2px; font-weight:900; }
  .hero .sub{ color:var(--muted); font-size:13px; }

  .card{ background:var(--glass); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px;
    backdrop-filter:blur(14px); box-shadow:0 10px 26px rgba(0,0,0,.3); }
  .chap{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid rgba(255,255,255,.06); }
  .chap:first-child{ border-top:none; }
  .chap .ic{ width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; font-size:17px; flex:none; }
  .chap .nm{ font-weight:700; font-size:14px; } .chap .nm small{ display:block; color:var(--muted); font-weight:500; font-size:11.5px; }
  .chap .st{ margin-left:auto; font-size:16px; letter-spacing:2px; }
  .chap .st .off{ opacity:.25; }

  .stats{ display:flex; gap:10px; }
  .stat{ flex:1; text-align:center; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:14px; padding:11px 6px; }
  .stat .k{ font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:700; }
  .stat .v{ font-size:19px; font-weight:800; margin-top:3px; }
  .stat .v.green{ color:var(--green); } .stat .v.cyan{ color:var(--cyan); }

  .quote{ font-style:italic; color:#cdd9ea; font-size:14px; line-height:1.5; }
  .quote .by{ display:block; font-style:normal; color:var(--muted); font-size:12px; margin-top:6px; }

  .btn{ width:100%; margin-top:6px; border:none; padding:15px; border-radius:15px; font-size:16px; font-weight:800; cursor:pointer;
    color:#04121f; background:linear-gradient(135deg,var(--blue),var(--cyan)); box-shadow:0 10px 24px rgba(30,115,255,.4); }
  .btn.ghost{ color:var(--txt); background:var(--glass); border:1px solid var(--line); box-shadow:none; margin-top:10px; }
  .btn:active{ transform:scale(.97); }
  .confetti{ position:fixed; top:-20px; font-size:18px; pointer-events:none; animation:fall 2.2s ease-in forwards; z-index:5; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(540deg); opacity:0; } }
</style>
</head>
<body>
  <div class="app">
    <div class="top"><a href="index.html">← Arcade</a><span id="brand" style="margin-left:6px"></span></div>
    <div id="content"></div>
  </div>
<script>
(function(){
  if(window.Arcade){ Arcade.mountBrand("brand",{size:24,fontSize:12,sub:"SETTLEMENT"}); }
  var r = Claim.summary();
  var content=document.getElementById("content");
  if(!r){ content.innerHTML='<div class="card">No active claim found. <a href="index.html" style="color:#E0218A">Back to Arcade</a></div>'; return; }
  var d=r.d;

  function starRow(n){ var s=""; for(var i=0;i<3;i++) s+='<span class="'+(i<n?"":"off")+'">★</span>'; return s; }
  var chapters=[
    {ic:"📞", nm:"Customer Setup", sub:"Call triaged & logged", stars:r.stars[0]},
    {ic:"📟", nm:"Engineer Dispatch", sub:"Crew sent to site", stars:r.stars[1]},
    {ic:"🔧", nm:"Repair the Leak", sub:"Pipework restored", stars:r.stars[2]}
  ];
  var chapsHtml=chapters.map(function(c){
    return '<div class="chap"><span class="ic">'+c.ic+'</span><span class="nm">'+c.nm+'<small>'+c.sub+'</small></span><span class="st">'+starRow(c.stars)+'</span></div>';
  }).join("");

  content.innerHTML =
    '<div class="hero">' +
      '<div class="grade">'+r.grade+'</div>' +
      '<h1>Claim Settled</h1>' +
      '<div class="sub">Claim #'+d.id+' · '+d.customer+' · '+d.perilName+' · '+r.gradeLabel+'</div>' +
    '</div>' +
    '<div class="card">'+chapsHtml+'</div>' +
    '<div class="card"><div class="stats">' +
      '<div class="stat"><div class="k">Payout</div><div class="v">£'+d.value.toLocaleString()+'</div></div>' +
      '<div class="stat"><div class="k">Margin</div><div class="v green">£'+r.profit.toLocaleString()+'</div></div>' +
      '<div class="stat"><div class="k">CSAT</div><div class="v cyan">'+r.csat+'%</div></div>' +
    '</div></div>' +
    '<div class="card"><div class="quote">“'+r.testimonial+'”<span class="by">— '+d.customer+', '+d.area+'</span></div></div>' +
    '<div class="card" style="padding:13px 16px"><div style="display:flex;font-size:13px;color:#9fb0c8"><span>Lifetime claims handled</span>' +
      '<b style="margin-left:auto;color:#eaf1fb">'+r.stats.claims+'</b></div>' +
      '<div style="display:flex;font-size:13px;color:#9fb0c8;margin-top:6px"><span>Total margin earned</span>' +
      '<b style="margin-left:auto;color:#34d399">£'+r.stats.profit.toLocaleString()+'</b></div></div>' +
    '<button class="btn" id="again">Take the next claim →</button>' +
    '<button class="btn ghost" id="home">Back to Arcade</button>';

  if(r.grade==="A"||r.grade==="B"){
    var em=["🎉","✨","💧","⭐","🔧"];
    for(var i=0;i<26;i++){ var s=document.createElement("span"); s.className="confetti"; s.textContent=em[i%em.length];
      s.style.left=(Math.random()*100)+"%"; s.style.animationDelay=(Math.random()*0.6)+"s"; document.body.appendChild(s);
      (function(n){ setTimeout(function(){ n.remove(); }, 2800); })(s); }
  }
  if(window.Arcade) Arcade.sfx.win();
  Claim.finish();

  document.getElementById("again").addEventListener("click", function(){ Claim.start(); });
  document.getElementById("home").addEventListener("click", function(){ location.href="index.html"; });
})();
</script>
</body>
</html>
