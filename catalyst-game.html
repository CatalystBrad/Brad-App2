<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Catalyst Tap ⚡</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #F2F2F7;
    color: #000;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app {
    position: relative;
    width: 100%;
    max-width: 420px;
    padding: 16px;
  }
  .scoreboard {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .stat {
    flex: 1;
    background: #fff;
    border-radius: 12px;
    padding: 12px 0;
    text-align: center;
    box-shadow: 0 2px 4px rgba(0,0,0,.1);
  }
  .stat .label {
    font-size: 12px;
    color: #8E8E93;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .stat .value {
    font-size: 24px;
    font-weight: bold;
    color: #007AFF;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .cell {
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    background: #E5E5EA;
    border: none;
    font-size: 11vw;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .05s ease;
    user-select: none;
  }
  @media (min-width: 420px) { .cell { font-size: 44px; } }
  .cell:active { transform: scale(.95); }
  .cell.target { background: #FFD60A; }
  .cell.bomb { background: #FF453A; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(242,242,247,.96);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    border-radius: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    font-size: 32px;
    margin: 0 0 16px;
  }
  .overlay p {
    font-size: 16px;
    color: #3A3A3C;
    line-height: 1.5;
    margin: 0 0 28px;
  }
  .final {
    font-size: 22px;
    color: #3A3A3C;
    margin: 0 0 12px;
  }
  .best-msg {
    font-size: 18px;
    color: #34C759;
    font-weight: 600;
    margin: 0 0 24px;
    min-height: 22px;
  }
  .btn {
    background: #007AFF;
    color: #fff;
    border: none;
    padding: 16px 40px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 4px rgba(0,0,0,.3);
  }
  .btn:active { opacity: .85; }
</style>
</head>
<body>
  <div class="app">
    <div class="scoreboard">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Time</div><div class="value" id="time">30s</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
    <div class="board" id="board"></div>

    <div class="overlay" id="startOverlay">
      <h1>Catalyst Tap ⚡</h1>
      <p>Tap the ⚡ to score. Avoid the 💣 (it costs you 2 points). You have 30 seconds — how high can you charge up?</p>
      <button class="btn" id="startBtn">Start Game</button>
    </div>

    <div class="overlay hidden" id="overOverlay">
      <h1>Time's Up!</h1>
      <p class="final" id="finalScore">You scored 0</p>
      <p class="best-msg" id="bestMsg"></p>
      <button class="btn" id="againBtn">Play Again</button>
    </div>
  </div>

<script>
  var GRID_SIZE = 9;
  var ROUND_SECONDS = 30;
  var HIGH_SCORE_KEY = "catalyst_game_high_score";

  var scoreEl = document.getElementById("score");
  var timeEl = document.getElementById("time");
  var bestEl = document.getElementById("best");
  var boardEl = document.getElementById("board");
  var startOverlay = document.getElementById("startOverlay");
  var overOverlay = document.getElementById("overOverlay");
  var finalScoreEl = document.getElementById("finalScore");
  var bestMsgEl = document.getElementById("bestMsg");

  var cells = [];
  var cellTypes = [];
  var score = 0;
  var timeLeft = ROUND_SECONDS;
  var highScore = parseInt(localStorage.getItem(HIGH_SCORE_KEY) || "0", 10) || 0;
  var playing = false;
  var spawnTimer = null;
  var countdownTimer = null;

  bestEl.textContent = highScore;

  // Build the 3x3 board once.
  for (var i = 0; i < GRID_SIZE; i++) {
    var btn = document.createElement("button");
    btn.className = "cell";
    btn.dataset.index = i;
    btn.addEventListener("click", onCellClick);
    boardEl.appendChild(btn);
    cells.push(btn);
    cellTypes.push("empty");
  }

  function setCell(index, type) {
    cellTypes[index] = type;
    var el = cells[index];
    el.className = "cell" + (type === "empty" ? "" : " " + type);
    el.textContent = type === "target" ? "⚡" : type === "bomb" ? "💣" : "";
  }

  function clearBoard() {
    for (var i = 0; i < GRID_SIZE; i++) { setCell(i, "empty"); }
  }

  function spawn() {
    clearBoard();
    var index = Math.floor(Math.random() * GRID_SIZE);
    setCell(index, Math.random() < 0.25 ? "bomb" : "target");
  }

  function onCellClick(e) {
    if (!playing) return;
    var index = parseInt(e.currentTarget.dataset.index, 10);
    var type = cellTypes[index];
    if (type === "empty") return;
    setCell(index, "empty");
    if (type === "target") { score += 1; }
    else if (type === "bomb") { score = Math.max(0, score - 2); }
    scoreEl.textContent = score;
  }

  function clearTimers() {
    if (spawnTimer) { clearInterval(spawnTimer); spawnTimer = null; }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  }

  function startGame() {
    clearTimers();
    score = 0;
    timeLeft = ROUND_SECONDS;
    playing = true;
    scoreEl.textContent = "0";
    timeEl.textContent = ROUND_SECONDS + "s";
    startOverlay.classList.add("hidden");
    overOverlay.classList.add("hidden");
    clearBoard();
    spawn();
    spawnTimer = setInterval(spawn, 800);
    countdownTimer = setInterval(function () {
      timeLeft -= 1;
      timeEl.textContent = timeLeft + "s";
      if (timeLeft <= 0) { endGame(); }
    }, 1000);
  }

  function endGame() {
    clearTimers();
    playing = false;
    clearBoard();
    var isBest = score > highScore && score > 0;
    if (isBest) {
      highScore = score;
      localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
      bestEl.textContent = highScore;
    }
    finalScoreEl.textContent = "You scored " + score;
    bestMsgEl.textContent = isBest ? "🏆 New best score!" : "";
    overOverlay.classList.remove("hidden");
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("againBtn").addEventListener("click", startGame);
</script>
</body>
</html>
