<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Fix the Water Leak</title>
<meta name="theme-color" content="#2A1745" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Catalyst" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<script src="arcade.js"></script>
<script src="claim.js"></script>
<style>
  :root {
    --bg0:#160d28; --glass:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
    --txt:#eaf1fb; --muted:#b6a6d6; --cyan:#E0218A; --blue:#7C3AED;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { margin:0; min-height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt); background:var(--bg0); overflow-x:hidden;
    display:flex; align-items:center; justify-content:center; padding:16px;
    padding-top:max(16px,env(safe-area-inset-top)); min-height:100vh;
  }
  body::before, body::after {
    content:""; position:fixed; width:60vmax; height:60vmax; border-radius:50%;
    filter:blur(85px); opacity:.5; z-index:-1; animation:drift 20s ease-in-out infinite;
  }
  body::before { background:radial-gradient(circle,var(--blue),transparent 60%); top:-18vmax; left:-12vmax; }
  body::after  { background:radial-gradient(circle,var(--cyan),transparent 60%); bottom:-20vmax; right:-14vmax; animation-delay:-10s; }
  @keyframes drift { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(3vmax,3vmax) scale(1.12);} }

  .app { position:relative; width:100%; max-width:460px; }
  .toprow { display:flex; align-items:center; margin-bottom:10px; }
  .back { display:inline-flex; align-items:center; gap:6px; color:var(--cyan); text-decoration:none; font-weight:600; font-size:14px; }
  .icobtn {
    width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--glass);
    color:var(--txt); font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer; margin-left:8px;
  }
  .icobtn:active { transform:scale(.93); }
  .spacer { flex:1; }
  .header { text-align:center; margin-bottom:16px; }
  .header h1 { font-size:24px; margin:0 0 3px; font-weight:800; letter-spacing:-.02em; }
  .header .sub { font-size:13px; color:var(--muted); }

  .scoreboard { display:flex; gap:9px; margin-bottom:14px; }
  .stat {
    flex:1; background:var(--glass); border:1px solid var(--line); border-radius:15px;
    padding:10px 0; text-align:center; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  }
  .stat .label { font-size:10px; color:var(--muted); text-transform:uppercase; font-weight:700; letter-spacing:1px; margin-bottom:2px; }
  .stat .value { font-size:22px; font-weight:800; background:linear-gradient(135deg,var(--cyan),var(--blue)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }

  .board {
    display:grid; gap:7px; padding:9px; border-radius:20px;
    background:var(--glass); border:1px solid var(--line);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow:0 16px 40px rgba(0,0,0,.4);
  }
  .cell {
    position:relative; aspect-ratio:1/1; border:none; padding:0; cursor:pointer; overflow:visible;
    background:rgba(255,255,255,.03); border-radius:12px; transition:box-shadow .2s;
  }
  .cell.fixed { background:rgba(34,211,238,.12); box-shadow:inset 0 0 0 1px rgba(34,211,238,.35); cursor:default; }
  .cell.hintpulse { animation:hint 1.1s ease-out 2; }
  @keyframes hint { 0%,100%{box-shadow:inset 0 0 0 0 rgba(163,230,53,0);} 50%{box-shadow:inset 0 0 0 3px rgba(163,230,53,.9), 0 0 18px rgba(163,230,53,.6);} }
  .pipe { width:100%; height:100%; transition:transform .22s cubic-bezier(.34,1.56,.64,1); }
  .pipe svg { width:100%; height:100%; display:block; overflow:visible; }
  .seg { stroke:#576175; stroke-width:21; stroke-linecap:round; fill:none; transition:stroke .3s ease; }
  .pipe.filled .seg { stroke:#2563eb; filter:drop-shadow(0 0 6px rgba(56,189,248,.7)); }
  .flow { stroke:#7fe7ff; stroke-width:8.5; stroke-linecap:round; fill:none; stroke-dasharray:7 15; opacity:0; transition:opacity .3s; }
  .pipe.filled .flow { opacity:1; animation:flow .55s linear infinite; }
  @keyframes flow { to { stroke-dashoffset:-22; } }
  .hub { fill:#6b7689; transition:fill .3s; }
  .pipe.filled .hub { fill:#38bdf8; }

  .badge {
    position:absolute; top:4px; left:4px; font-size:8.5px; font-weight:800; letter-spacing:.5px;
    color:#04121f; background:linear-gradient(135deg,var(--cyan),var(--blue)); padding:2px 6px; border-radius:7px; z-index:2;
  }
  .badge.out { background:linear-gradient(135deg,#34d399,#a3e635); color:#06210f; left:auto; right:4px; }

  .controls { display:flex; gap:10px; margin-top:16px; }
  .btn {
    flex:1; border:none; padding:14px; border-radius:15px; font-size:15px; font-weight:800; cursor:pointer;
    color:#04121f; background:linear-gradient(135deg,var(--cyan),var(--blue));
    box-shadow:0 8px 22px rgba(34,211,238,.35); transition:transform .1s, opacity .2s;
  }
  .btn.secondary { color:var(--txt); background:var(--glass); border:1px solid var(--line); box-shadow:none; }
  .btn:disabled { opacity:.4; }
  .btn:active { transform:scale(.96); }

  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px; border-radius:20px;
    background:rgba(7,11,22,.82); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    opacity:1; transition:opacity .25s;
  }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .overlay h2 { font-size:30px; margin:0 0 6px; font-weight:800; }
  .overlay p { font-size:15px; color:var(--muted); margin:0 0 4px; }
  .stars { font-size:42px; letter-spacing:6px; margin:6px 0 8px; }
  .stars .on { filter:drop-shadow(0 0 10px rgba(255,210,60,.8)); }
  .stars .off { opacity:.25; }
  .overlay .big { font-size:18px; font-weight:800; color:#a3e635; margin:6px 0 4px; min-height:22px; }

  .confetti { position:absolute; font-size:20px; pointer-events:none; animation:drop 1.5s ease-in forwards; z-index:5; }
  @keyframes drop { 0%{transform:translateY(-20px) rotate(0); opacity:1;} 100%{transform:translateY(380px) rotate(360deg); opacity:0;} }
</style>
</head>
<body>
  <div class="app">
    <div class="toprow">
      <a class="back" href="index.html">←</a>
      <span id="brand" style="margin-left:10px"></span>
      <div class="spacer"></div>
      <button class="icobtn" id="hintBtn" title="Hint">💡</button>
      <button class="icobtn" id="undoBtn" title="Undo">↩️</button>
      <button class="icobtn" id="muteBtn" title="Sound"></button>
    </div>
    <div id="banner" style="margin-bottom:14px"></div>
    <div class="header">
      <h1>Fix the Water Leak 🚰</h1>
      <div class="sub">Rotate the pipes — connect the inlet to the drain</div>
    </div>

    <div class="scoreboard">
      <div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
      <div class="stat"><div class="label">Moves</div><div class="value" id="moves">0</div></div>
      <div class="stat"><div class="label">Par</div><div class="value" id="par">0</div></div>
      <div class="stat"><div class="label">Time</div><div class="value" id="time">0s</div></div>
    </div>

    <div class="board" id="board"></div>

    <div class="controls">
      <button class="btn secondary" id="newBtn">New Layout</button>
      <button class="btn" id="nextBtn" style="display:none;">Next Level →</button>
    </div>

    <div class="overlay hidden" id="winOverlay">
      <h2>Flow Restored! 💧</h2>
      <div class="stars" id="stars"></div>
      <p id="winStats">Solved in 0 moves</p>
      <p class="big" id="winBest"></p>
      <button class="btn" id="winNext" style="max-width:220px;">Next Level →</button>
    </div>
  </div>

<script>
(function () {
  var N = 0, E = 1, S = 2, W = 3;
  var DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1];
  var BASE = { straight: [N, S], elbow: [N, E], tee: [N, E, S] };
  var BEST_KEY = "catalyst_drain_best", STARS_KEY = "catalyst_drain_stars";

  var levelEl = document.getElementById("level");
  var movesEl = document.getElementById("moves");
  var parEl = document.getElementById("par");
  var timeEl = document.getElementById("time");
  var boardEl = document.getElementById("board");
  var winOverlay = document.getElementById("winOverlay");
  var winStats = document.getElementById("winStats");
  var winBest = document.getElementById("winBest");
  var starsEl = document.getElementById("stars");
  var nextBtn = document.getElementById("nextBtn");
  var undoBtn = document.getElementById("undoBtn");

  var SIZE = 5;
  var cells = [], pipeEls = [], cellEls = [], visualRot = [], history = [];
  var startIdx = 0, endIdx = 0, level = 1, moves = 0, par = 0, seconds = 0, solved = false, ticker = null;
  var musicStarted = false;
  var best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0;

  var CAMPAIGN = new URLSearchParams(location.search).has("claim") && window.Claim && !!Claim.load();
  if(CAMPAIGN){ var cd=Claim.load(); level = cd.severity===1?1 : cd.severity===2?4:7; }

  function gridForLevel(l) { return l < 4 ? 5 : l < 7 ? 6 : 7; }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
  function idx(r,c){ return r*SIZE+c; }
  function dirFromTo(r,c,r2,c2){ if(r2===r-1)return N; if(r2===r+1)return S; if(c2===c+1)return E; return W; }
  function connsOf(cell){ return BASE[cell.type].map(function(d){return (d+cell.rot)%4;}); }
  function hasDir(cell,d){ return connsOf(cell).indexOf(d)!==-1; }
  function turnDist(a,b){ var d=Math.abs(a-b)%4; return Math.min(d,4-d); }

  function carvePath(){
    var v=[]; for(var i=0;i<SIZE;i++) v.push(new Array(SIZE).fill(false));
    var path=[];
    function dfs(r,c){
      v[r][c]=true; path.push([r,c]);
      if(r===SIZE-1&&c===SIZE-1) return true;
      var o=shuffle([N,E,S,W]);
      for(var k=0;k<4;k++){ var d=o[k], nr=r+DR[d], nc=c+DC[d];
        if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&!v[nr][nc]){ if(dfs(nr,nc)) return true; } }
      path.pop(); return false;
    }
    dfs(0,0); return path;
  }
  function typeRotFor(dirs){
    var set=dirs.slice().sort().join(","), types=["straight","elbow","tee"];
    for(var t=0;t<types.length;t++){ var base=BASE[types[t]];
      for(var rot=0;rot<4;rot++){ var got=base.map(function(d){return (d+rot)%4;}).sort().join(",");
        if(got===set) return {type:types[t],rot:rot}; } }
    return {type:"elbow",rot:0};
  }
  function flood(){
    var f={}, dist={}, q=[startIdx]; f[startIdx]=true; dist[startIdx]=0;
    while(q.length){ var cur=q.shift(), cell=cells[cur], conns=connsOf(cell);
      for(var i=0;i<conns.length;i++){ var d=conns[i], nr=cell.r+DR[d], nc=cell.c+DC[d];
        if(nr<0||nr>=SIZE||nc<0||nc>=SIZE) continue;
        var nI=idx(nr,nc); if(f[nI]) continue;
        if(hasDir(cells[nI],(d+2)%4)){ f[nI]=true; dist[nI]=dist[cur]+1; q.push(nI); } } }
    return {set:f, dist:dist};
  }
  function isSolved(){ return !!flood().set[endIdx]; }

  function buildLevel(){
    SIZE = gridForLevel(level);
    boardEl.style.gridTemplateColumns = "repeat(" + SIZE + ", 1fr)";
    var path=carvePath(), onPath={};
    for(var i=0;i<path.length;i++) onPath[idx(path[i][0],path[i][1])]=i;
    cells=[];
    for(var r=0;r<SIZE;r++) for(var c=0;c<SIZE;c++) cells.push({type:"straight",rot:0,fixed:false,r:r,c:c,solvedRot:null});
    startIdx=idx(0,0); endIdx=idx(SIZE-1,SIZE-1);
    for(var p=0;p<path.length;p++){
      var r0=path[p][0], c0=path[p][1], here=idx(r0,c0), dirs=[];
      if(p>0) dirs.push(dirFromTo(r0,c0,path[p-1][0],path[p-1][1])); else dirs.push(W);
      if(p<path.length-1) dirs.push(dirFromTo(r0,c0,path[p+1][0],path[p+1][1])); else dirs.push(E);
      var tr=typeRotFor(dirs); cells[here].type=tr.type; cells[here].rot=tr.rot; cells[here].solvedRot=tr.rot;
    }
    cells[startIdx].fixed=true; cells[endIdx].fixed=true;
    var decoys=["straight","elbow","elbow","tee"];
    for(var q=0;q<cells.length;q++){ if(!(q in onPath)){ cells[q].type=decoys[Math.floor(Math.random()*decoys.length)]; cells[q].rot=Math.floor(Math.random()*4); } }
    for(var s=0;s<cells.length;s++){ if(!cells[s].fixed) cells[s].rot=Math.floor(Math.random()*4); }
    if(isSolved()){ var free=cells.findIndex(function(x){return !x.fixed;}); if(free>=0) cells[free].rot=(cells[free].rot+1)%4; }

    // Par = minimum rotations to align the solution path.
    par=0;
    for(var pc=0;pc<cells.length;pc++){ var cc=cells[pc]; if(cc.solvedRot!=null && !cc.fixed) par+=turnDist(cc.rot,cc.solvedRot); }
    if(par<1) par=1;

    moves=0; seconds=0; solved=false; history=[];
    movesEl.textContent="0"; parEl.textContent=par; timeEl.textContent="0s"; levelEl.textContent=level;
    nextBtn.style.display="none"; winOverlay.classList.add("hidden");
    updateUndo();
    buildBoard(); paint(); startTicker();
  }

  function pipeSVG(type){
    var seg={0:'50,50 50,0',1:'50,50 100,50',2:'50,50 50,100',3:'50,50 0,50'};
    var lines="", flow="";
    BASE[type].forEach(function(d){ var pts=seg[d];
      lines+='<polyline class="seg" points="'+pts+'"/>';
      flow +='<polyline class="flow" points="'+pts+'"/>'; });
    return '<svg viewBox="0 0 100 100">'+lines+flow+'<circle class="hub" cx="50" cy="50" r="11"/></svg>';
  }

  function buildBoard(){
    boardEl.innerHTML=""; pipeEls=[]; cellEls=[]; visualRot=[];
    for(var i=0;i<cells.length;i++){
      var cell=cells[i];
      var btn=document.createElement("button");
      btn.className="cell"+(cell.fixed?" fixed":"");
      var pipe=document.createElement("div");
      pipe.className="pipe"; pipe.innerHTML=pipeSVG(cell.type);
      visualRot[i]=cell.rot*90; pipe.style.transform="rotate("+visualRot[i]+"deg)";
      btn.appendChild(pipe);
      if(i===startIdx){ var b1=document.createElement("span"); b1.className="badge"; b1.textContent="IN"; btn.appendChild(b1); }
      if(i===endIdx){ var b2=document.createElement("span"); b2.className="badge out"; b2.textContent="OUT"; btn.appendChild(b2); }
      (function(index){ btn.addEventListener("click", function(){ onTap(index); }); })(i);
      boardEl.appendChild(btn);
      pipeEls[i]=pipe; cellEls[i]=btn;
    }
  }

  function paint(){
    var fl=flood();
    for(var i=0;i<cells.length;i++){
      var on=!!fl.set[i];
      // progressive fill: water "travels" out from the inlet
      pipeEls[i].querySelectorAll(".seg,.flow").forEach(function(node){
        node.style.transitionDelay = on ? (fl.dist[i]*0.05)+"s" : "0s";
      });
      pipeEls[i].classList.toggle("filled", on);
    }
  }

  function startMusicOnce(){ if(!musicStarted){ musicStarted=true; if(window.Arcade) Arcade.startMusic("calm"); } }

  function onTap(i){
    if(solved || cells[i].fixed) return;
    startMusicOnce();
    cells[i].rot=(cells[i].rot+1)%4;
    visualRot[i]+=90; pipeEls[i].style.transform="rotate("+visualRot[i]+"deg)";
    history.push(i);
    moves++; movesEl.textContent=moves; updateUndo();
    if(window.Arcade) Arcade.sfx.rotate();
    paint();
    if(isSolved()) win();
  }

  function undo(){
    if(solved || !history.length) return;
    var i=history.pop();
    cells[i].rot=(cells[i].rot+3)%4;
    visualRot[i]-=90; pipeEls[i].style.transform="rotate("+visualRot[i]+"deg)";
    moves=Math.max(0,moves-1); movesEl.textContent=moves; updateUndo();
    if(window.Arcade) Arcade.sfx.undo();
    paint();
  }
  function updateUndo(){ undoBtn.disabled = solved || history.length===0; }

  function hint(){
    if(solved) return;
    for(var i=0;i<cells.length;i++){
      var c=cells[i];
      if(!c.fixed && c.solvedRot!=null && c.rot!==c.solvedRot){
        var el=cellEls[i]; el.classList.remove("hintpulse"); void el.offsetWidth; el.classList.add("hintpulse");
        if(window.Arcade) Arcade.sfx.hint();
        return;
      }
    }
  }

  function startTicker(){
    if(ticker) clearInterval(ticker);
    ticker=setInterval(function(){ if(solved) return; seconds++; timeEl.textContent=seconds+"s"; },1000);
  }

  function showStars(n){
    var s="";
    for(var i=0;i<3;i++) s+= '<span class="'+(i<n?"on":"off")+'">★</span>';
    starsEl.innerHTML=s;
  }

  function confettiBurst(){
    var drops=["💧","💦","🌊","✨"];
    for(var i=0;i<24;i++){
      var s=document.createElement("span");
      s.className="confetti"; s.textContent=drops[i%drops.length];
      s.style.left=(Math.random()*90+5)+"%"; s.style.top="18%";
      s.style.animationDelay=(Math.random()*0.4)+"s";
      winOverlay.appendChild(s);
      (function(node){ setTimeout(function(){ node.remove(); },2000); })(s);
    }
  }

  function win(){
    solved=true; if(ticker) clearInterval(ticker); updateUndo();
    var rating = moves<=par ? 3 : (moves<=Math.ceil(par*1.5) ? 2 : 1);
    var total = parseInt(localStorage.getItem(STARS_KEY)||"0",10)+rating;
    localStorage.setItem(STARS_KEY, String(total));
    showStars(rating);
    nextBtn.style.display="block";
    winStats.textContent="Solved in "+moves+" moves · par "+par+" · "+seconds+"s";
    var isBest = best===0 || moves<best;
    if(isBest){ best=moves; localStorage.setItem(BEST_KEY,String(best)); winBest.textContent="🏆 Fewest moves yet!"; }
    else winBest.textContent="Best: "+best+" moves  ·  ⭐ "+total+" total";
    if(CAMPAIGN){
      nextBtn.style.display="none";
      var b=document.getElementById("winNext");
      var nb=b.cloneNode(true); b.parentNode.replaceChild(nb,b);
      nb.textContent="Settle the claim →";
      nb.addEventListener("click", function(){ Claim.completeRepair({stars:rating, moves:moves, par:par, seconds:seconds}); });
    }
    winOverlay.classList.remove("hidden");
    if(window.Arcade) Arcade.sfx.win();
    confettiBurst();
  }

  function nextLevel(){ if(CAMPAIGN) return; level++; if(window.Arcade) Arcade.sfx.levelup(); buildLevel(); }

  document.getElementById("newBtn").addEventListener("click", function(){ startMusicOnce(); buildLevel(); });
  nextBtn.addEventListener("click", nextLevel);
  document.getElementById("winNext").addEventListener("click", nextLevel);
  undoBtn.addEventListener("click", undo);
  document.getElementById("hintBtn").addEventListener("click", hint);
  if(window.Arcade){ Arcade.bindMute("muteBtn"); Arcade.mountBrand("brand",{size:28,fontSize:14}); }
  if(CAMPAIGN){ document.getElementById("newBtn").style.display="none"; if(window.Claim) Claim.mountBanner("banner","repair"); }

  buildLevel();
})();
</script>
</body>
</html>
