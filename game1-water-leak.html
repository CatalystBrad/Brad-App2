<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Game 1 · Fix the Water Leak</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #F2F2F7; color: #000;
  }
  body { display: flex; align-items: center; justify-content: center; }
  .app { position: relative; width: 100%; max-width: 440px; padding: 16px; }
  .header { text-align: center; margin-bottom: 16px; }
  .header h1 { font-size: 24px; margin: 0 0 4px; }
  .header .sub { font-size: 13px; color: #8E8E93; }
  .scoreboard { display: flex; gap: 8px; margin-bottom: 16px; }
  .stat {
    flex: 1; background: #fff; border-radius: 12px; padding: 10px 0; text-align: center;
    box-shadow: 0 2px 4px rgba(0,0,0,.1);
  }
  .stat .label { font-size: 11px; color: #8E8E93; text-transform: uppercase; font-weight: 600; margin-bottom: 2px; }
  .stat .value { font-size: 22px; font-weight: bold; color: #007AFF; }
  .board {
    display: grid; gap: 6px; background: #D8D8DD; padding: 6px; border-radius: 16px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.15);
  }
  .cell {
    position: relative; aspect-ratio: 1/1; border: none; padding: 0;
    background: #F7F7FA; border-radius: 8px; cursor: pointer; overflow: hidden;
    transition: transform .06s ease;
  }
  .cell:active { transform: scale(.94); }
  .cell.fixed { background: #E8F0FF; cursor: default; }
  .cell svg { width: 100%; height: 100%; display: block; }
  .badge {
    position: absolute; top: 3px; left: 3px; font-size: 9px; font-weight: 700;
    color: #fff; background: #0A84FF; padding: 1px 5px; border-radius: 6px; letter-spacing: .5px;
  }
  .badge.out { background: #34C759; left: auto; right: 3px; }
  .controls { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1; background: #007AFF; color: #fff; border: none; padding: 14px; border-radius: 14px;
    font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 4px rgba(0,0,0,.2);
  }
  .btn.secondary { background: #fff; color: #007AFF; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
  .btn:active { opacity: .85; }
  .overlay {
    position: absolute; inset: 0; background: rgba(242,242,247,.97);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px; border-radius: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 30px; margin: 0 0 10px; }
  .overlay p { font-size: 16px; color: #3A3A3C; line-height: 1.5; margin: 0 0 8px; }
  .overlay .big { font-size: 20px; color: #34C759; font-weight: 700; margin: 10px 0 22px; min-height: 22px; }
</style>
</head>
<body>
  <div class="app">
    <a href="index.html" style="display:inline-block;margin-bottom:10px;color:#007AFF;text-decoration:none;font-weight:600;font-size:14px;">← Arcade</a>
    <div class="header">
      <h1>Fix the Water Leak 🚰</h1>
      <div class="sub">Rotate the pipes — connect the inlet to the drain</div>
    </div>

    <div class="scoreboard">
      <div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
      <div class="stat"><div class="label">Moves</div><div class="value" id="moves">0</div></div>
      <div class="stat"><div class="label">Time</div><div class="value" id="time">0s</div></div>
    </div>

    <div class="board" id="board"></div>

    <div class="controls">
      <button class="btn secondary" id="newBtn">New Layout</button>
      <button class="btn" id="nextBtn" style="display:none;">Next Level →</button>
    </div>

    <div class="overlay hidden" id="winOverlay">
      <h2>Flow Restored! 💧</h2>
      <p id="winStats">Solved in 0 moves</p>
      <p class="big" id="winBest"></p>
      <button class="btn" id="winNext">Next Level →</button>
    </div>
  </div>

<script>
(function () {
  // Directions: 0=N 1=E 2=S 3=W
  var N = 0, E = 1, S = 2, W = 3;
  var DR = [-1, 0, 1, 0];
  var DC = [0, 1, 0, -1];
  var BASE = { straight: [N, S], elbow: [N, E], tee: [N, E, S] };

  var SIZE = 5;
  var BEST_KEY = "catalyst_drain_best";

  var levelEl = document.getElementById("level");
  var movesEl = document.getElementById("moves");
  var timeEl = document.getElementById("time");
  var boardEl = document.getElementById("board");
  var winOverlay = document.getElementById("winOverlay");
  var winStats = document.getElementById("winStats");
  var winBest = document.getElementById("winBest");
  var nextBtn = document.getElementById("nextBtn");

  var cells = [];          // flat array of {type, rot, fixed, r, c}
  var startIdx = 0, endIdx = 0;
  var level = 1;
  var moves = 0;
  var seconds = 0;
  var solved = false;
  var ticker = null;
  var best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0;

  boardEl.style.gridTemplateColumns = "repeat(" + SIZE + ", 1fr)";

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function idx(r, c) { return r * SIZE + c; }

  // Carve a self-avoiding path from top-left to bottom-right.
  function carvePath() {
    var visited = [];
    for (var i = 0; i < SIZE; i++) visited.push(new Array(SIZE).fill(false));
    var path = [];
    function dfs(r, c) {
      visited[r][c] = true;
      path.push([r, c]);
      if (r === SIZE - 1 && c === SIZE - 1) return true;
      var order = shuffle([N, E, S, W]);
      for (var k = 0; k < 4; k++) {
        var d = order[k];
        var nr = r + DR[d], nc = c + DC[d];
        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && !visited[nr][nc]) {
          if (dfs(nr, nc)) return true;
        }
      }
      path.pop();
      return false;
    }
    dfs(0, 0);
    return path;
  }

  // Given a set of open directions, find {type, rot} that produces it.
  function typeRotFor(dirs) {
    var set = dirs.slice().sort().join(",");
    var types = ["straight", "elbow", "tee"];
    for (var t = 0; t < types.length; t++) {
      var base = BASE[types[t]];
      for (var rot = 0; rot < 4; rot++) {
        var got = base.map(function (d) { return (d + rot) % 4; }).sort().join(",");
        if (got === set) return { type: types[t], rot: rot };
      }
    }
    return { type: "elbow", rot: 0 };
  }

  function buildLevel() {
    var path = carvePath();
    var onPath = {};
    for (var i = 0; i < path.length; i++) onPath[idx(path[i][0], path[i][1])] = i;

    cells = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        cells.push({ type: "straight", rot: 0, fixed: false, r: r, c: c });
      }
    }

    startIdx = idx(0, 0);
    endIdx = idx(SIZE - 1, SIZE - 1);

    // Set pipe pieces along the solution path.
    for (var p = 0; p < path.length; p++) {
      var r0 = path[p][0], c0 = path[p][1];
      var here = idx(r0, c0);
      var dirs = [];
      if (p > 0) {
        var pr = path[p - 1];
        dirs.push(dirFromTo(r0, c0, pr[0], pr[1]));
      } else {
        dirs.push(W); // inlet stub pointing off-grid (left edge)
      }
      if (p < path.length - 1) {
        var nx = path[p + 1];
        dirs.push(dirFromTo(r0, c0, nx[0], nx[1]));
      } else {
        dirs.push(E); // drain outlet stub pointing off-grid (right edge)
      }
      var tr = typeRotFor(dirs);
      cells[here].type = tr.type;
      cells[here].rot = tr.rot;
      cells[here].solvedRot = tr.rot;
    }

    // Endpoints are fixed so the inlet/drain stay anchored.
    cells[startIdx].fixed = true;
    cells[endIdx].fixed = true;

    // Decoy pieces on the empty cells.
    var decoys = ["straight", "elbow", "elbow", "tee"];
    for (var q = 0; q < cells.length; q++) {
      if (!(q in onPath)) {
        cells[q].type = decoys[Math.floor(Math.random() * decoys.length)];
        cells[q].rot = Math.floor(Math.random() * 4);
      }
    }

    // Scramble rotations of the non-fixed path pieces so it starts unsolved.
    var scrambled = false;
    for (var s = 0; s < cells.length; s++) {
      if (!cells[s].fixed) {
        var before = cells[s].rot;
        cells[s].rot = Math.floor(Math.random() * 4);
        if (cells[s].rot !== before) scrambled = true;
      }
    }
    // Guarantee the board doesn't start already solved.
    if (!scrambled || isSolved()) {
      var firstFree = cells.findIndex(function (x) { return !x.fixed; });
      if (firstFree >= 0) cells[firstFree].rot = (cells[firstFree].rot + 1) % 4;
    }

    moves = 0;
    seconds = 0;
    solved = false;
    movesEl.textContent = "0";
    timeEl.textContent = "0s";
    levelEl.textContent = level;
    nextBtn.style.display = "none";
    winOverlay.classList.add("hidden");
    startTicker();
    render();
  }

  function dirFromTo(r, c, r2, c2) {
    if (r2 === r - 1) return N;
    if (r2 === r + 1) return S;
    if (c2 === c + 1) return E;
    return W;
  }

  function connsOf(cell) {
    return BASE[cell.type].map(function (d) { return (d + cell.rot) % 4; });
  }

  function hasDir(cell, d) {
    return connsOf(cell).indexOf(d) !== -1;
  }

  // Flood fill from the inlet through mutually-open pipe connections.
  function filledSet() {
    var filled = {};
    var queue = [startIdx];
    filled[startIdx] = true;
    while (queue.length) {
      var cur = queue.shift();
      var cell = cells[cur];
      var conns = connsOf(cell);
      for (var i = 0; i < conns.length; i++) {
        var d = conns[i];
        var nr = cell.r + DR[d], nc = cell.c + DC[d];
        if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
        var nIdx = idx(nr, nc);
        if (filled[nIdx]) continue;
        if (hasDir(cells[nIdx], (d + 2) % 4)) {
          filled[nIdx] = true;
          queue.push(nIdx);
        }
      }
    }
    return filled;
  }

  function isSolved() {
    return !!filledSet()[endIdx];
  }

  function pipeSVG(cell, filled) {
    var color = filled ? "#0A84FF" : "#9AA0A8";
    var conns = connsOf(cell);
    var seg = {
      0: '<line x1="50" y1="50" x2="50" y2="0"/>',
      1: '<line x1="50" y1="50" x2="100" y2="50"/>',
      2: '<line x1="50" y1="50" x2="50" y2="100"/>',
      3: '<line x1="50" y1="50" x2="0" y2="50"/>'
    };
    var lines = "";
    for (var i = 0; i < conns.length; i++) lines += seg[conns[i]];
    return '<svg viewBox="0 0 100 100">' +
      '<g stroke="' + color + '" stroke-width="20" stroke-linecap="round" fill="none">' +
      lines + '</g>' +
      '<circle cx="50" cy="50" r="11" fill="' + color + '"/>' +
      (filled ? '<circle cx="50" cy="50" r="5" fill="#9BD2FF"/>' : '') +
      '</svg>';
  }

  function render() {
    var filled = filledSet();
    boardEl.innerHTML = "";
    for (var i = 0; i < cells.length; i++) {
      var cell = cells[i];
      var btn = document.createElement("button");
      btn.className = "cell" + (cell.fixed ? " fixed" : "");
      btn.dataset.index = i;
      btn.innerHTML = pipeSVG(cell, !!filled[i]);
      if (i === startIdx) {
        var b1 = document.createElement("span"); b1.className = "badge"; b1.textContent = "IN"; btn.appendChild(b1);
      }
      if (i === endIdx) {
        var b2 = document.createElement("span"); b2.className = "badge out"; b2.textContent = "OUT"; btn.appendChild(b2);
      }
      btn.addEventListener("click", onTap);
      boardEl.appendChild(btn);
    }
  }

  function onTap(e) {
    if (solved) return;
    var i = parseInt(e.currentTarget.dataset.index, 10);
    if (cells[i].fixed) return;
    cells[i].rot = (cells[i].rot + 1) % 4;
    moves++;
    movesEl.textContent = moves;
    render();
    if (isSolved()) win();
  }

  function startTicker() {
    if (ticker) clearInterval(ticker);
    ticker = setInterval(function () {
      if (solved) return;
      seconds++;
      timeEl.textContent = seconds + "s";
    }, 1000);
  }

  function win() {
    solved = true;
    if (ticker) clearInterval(ticker);
    nextBtn.style.display = "block";
    winStats.textContent = "Solved in " + moves + " moves and " + seconds + "s";
    var isBest = best === 0 || moves < best;
    if (isBest) {
      best = moves;
      localStorage.setItem(BEST_KEY, String(best));
      winBest.textContent = "🏆 Fewest moves yet!";
    } else {
      winBest.textContent = "Best: " + best + " moves";
    }
    winOverlay.classList.remove("hidden");
  }

  function nextLevel() {
    level++;
    buildLevel();
  }

  document.getElementById("newBtn").addEventListener("click", buildLevel);
  nextBtn.addEventListener("click", nextLevel);
  document.getElementById("winNext").addEventListener("click", nextLevel);

  buildLevel();
})();
</script>
</body>
</html>
