name: Daily Holiday Deals

on:
  schedule:
    # 07:00 UTC daily (~08:00 UK)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-deals
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scrapers/package.json

      - name: Install scraper deps
        working-directory: scrapers
        run: npm install --no-audit --no-fund

      - name: Run scrapers
        working-directory: scrapers
        run: npm run scrape

      - name: Show summary
        run: |
          echo "Deals file size: $(wc -c < data/deals.json) bytes"
          echo "Top of meta:"
          cat data/meta.json
          echo "Errors:"
          cat data/scrape-errors.json

      - name: Commit updated deals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/deals.json data/scrape-errors.json data/meta.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(deals): daily refresh $(date -u +%Y-%m-%d) [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
