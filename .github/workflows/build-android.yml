name: Build Android APK

on:
  push:
    branches: [ claude/build-new-app-dRKfI, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Node dependencies
      run: |
        npm ci --legacy-peer-deps || npm install --legacy-peer-deps

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle Wrapper
      run: |
        cd android
        gradle wrapper --gradle-version 8.3 --distribution-type all
        chmod +x gradlew
        cd ..

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Android Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon --stacktrace
        cd ..

    - name: List build outputs
      run: |
        echo "Checking build outputs..."
        find android/app/build/outputs -name "*.apk" -type f

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SiteInspector-release
        path: android/app/build/outputs/apk/release/*.apk
        if-no-files-found: error

    - name: Create Release Info
      if: success()
      run: |
        echo "# 📱 Site Inspection App - Android Release" > release-info.txt
        echo "" >> release-info.txt
        echo "✅ Build completed successfully!" >> release-info.txt
        echo "" >> release-info.txt
        echo "## Download Instructions:" >> release-info.txt
        echo "1. Download the APK from the artifacts section above" >> release-info.txt
        echo "2. Transfer it to your Android phone" >> release-info.txt
        echo "3. Enable 'Install from Unknown Sources' in your phone settings" >> release-info.txt
        echo "4. Tap the APK file to install" >> release-info.txt
        echo "" >> release-info.txt
        echo "Build Date: $(date)" >> release-info.txt
        echo "Build Number: ${{ github.run_number }}" >> release-info.txt

    - name: Upload Release Info
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: release-info
        path: release-info.txt
