name: Build Android APK

on:
  push:
    branches: [ claude/build-new-app-dRKfI, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build Android Release APK
      run: |
        cd android
        ./gradlew assembleRelease
        cd ..

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/app-release.apk

    - name: Create Release Info
      run: |
        echo "# 📱 Site Inspection App - Android Release" > release-info.txt
        echo "" >> release-info.txt
        echo "✅ Build completed successfully!" >> release-info.txt
        echo "" >> release-info.txt
        echo "## Download Instructions:" >> release-info.txt
        echo "1. Download the APK from the artifacts section above" >> release-info.txt
        echo "2. Transfer it to your Android phone" >> release-info.txt
        echo "3. Enable 'Install from Unknown Sources' in your phone settings" >> release-info.txt
        echo "4. Tap the APK file to install" >> release-info.txt
        echo "" >> release-info.txt
        echo "Build Date: $(date)" >> release-info.txt

    - name: Upload Release Info
      uses: actions/upload-artifact@v4
      with:
        name: release-info
        path: release-info.txt
